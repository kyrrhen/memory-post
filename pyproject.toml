[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-post"
version = "1.1.0"
description = "Train photos into small SIREN models, send the models plus residuals, and reconstruct images offline."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Memory Post contributors" }]
keywords = ["siren", "implicit-neural-representation", "image-compression", "pyqt6", "numpy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "numpy>=1.24",
  "pillow>=10.0",
  "PyQt6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[project.gui-scripts]
memory-post = "memory_post:main"

[tool.setuptools]
py-modules = ["memory_post", "sender", "receiver", "siren_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
