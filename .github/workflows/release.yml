name: build-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Build Windows executable
        run: cmd /c build_exe.bat
      - name: Run executable selftest
        run: .\dist\MemoryPost.exe --selftest-full .\selftest-out
      - name: Create checksum
        run: |
          $hash = (Get-FileHash .\dist\MemoryPost.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  MemoryPost.exe" | Set-Content .\dist\MemoryPost.exe.sha256 -Encoding ascii
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: MemoryPost-windows-x64
          path: |
            dist/MemoryPost.exe
            dist/MemoryPost.exe.sha256
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "RELEASE_NOTES_$env:GITHUB_REF_NAME.md"
          if (Test-Path $notes) {
            gh release create "$env:GITHUB_REF_NAME" `
              ".\dist\MemoryPost.exe" `
              ".\dist\MemoryPost.exe.sha256" `
              --title "Memory Post $env:GITHUB_REF_NAME" `
              --notes-file $notes
          } else {
            gh release create "$env:GITHUB_REF_NAME" `
              ".\dist\MemoryPost.exe" `
              ".\dist\MemoryPost.exe.sha256" `
              --title "Memory Post $env:GITHUB_REF_NAME" `
              --generate-notes
          }
